name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Start test infrastructure
        run: |
          docker compose up -d mysql1 mysql2 mysql3 toxiproxy toxiproxy-bootstrap

      - name: Wait for MySQL containers
        run: |
          set -e
          for container in mysql mysql2 mysql3; do
            echo "Waiting for ${container}..."
            for i in $(seq 1 90); do
              if docker exec "${container}" mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
                echo "${container} is ready"
                break
              fi

              if [ "$i" -eq 90 ]; then
                echo "${container} did not become ready in time"
                docker logs "${container}" || true
                exit 1
              fi

              sleep 2
            done
          done

      - name: Verify toxiproxy bootstrap
        run: |
          curl -sS -H "User-Agent: curl" http://localhost:8474/proxies

      - name: Run tests
        run: |
          python -m pytest -v -m "not e2e"

      - name: Dump compose logs
        if: always()
        run: |
          docker compose logs --no-color > compose.log || true

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log

      - name: Stop infrastructure
        if: always()
        run: |
          docker compose down -v

  toxiproxy-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: core-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Start test infrastructure
        run: |
          docker compose up -d mysql1 mysql2 mysql3 toxiproxy toxiproxy-bootstrap

      - name: Wait for MySQL containers
        run: |
          set -e
          for container in mysql mysql2 mysql3; do
            echo "Waiting for ${container}..."
            for i in $(seq 1 90); do
              if docker exec "${container}" mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
                echo "${container} is ready"
                break
              fi

              if [ "$i" -eq 90 ]; then
                echo "${container} did not become ready in time"
                docker logs "${container}" || true
                exit 1
              fi

              sleep 2
            done
          done

      - name: Start backend server
        run: |
          PYTHONPATH=backend nohup python -u -c "from app import app; app.run(host='0.0.0.0', port=5000, debug=False)" > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for backend and proxy health
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5000/api/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend health check failed"
              cat backend.log || true
              exit 1
            fi
            sleep 2
          done

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8666/api/health >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Proxy health check failed"
              curl -sS -H "User-Agent: curl" http://localhost:8474/proxies || true
              cat backend.log || true
              exit 1
            fi
            sleep 2
          done

      - name: Run toxiproxy e2e tests
        env:
          RUN_TOXIPROXY_E2E: "1"
        run: |
          python -m pytest -v -m "e2e"

      - name: Dump logs
        if: always()
        run: |
          docker compose logs --no-color > compose.log || true
          cat backend.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toxiproxy-e2e-logs
          path: |
            compose.log
            backend.log

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" || true
          fi

      - name: Stop infrastructure
        if: always()
        run: |
          docker compose down -v
